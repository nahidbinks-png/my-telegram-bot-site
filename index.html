<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotSphere - Main Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Container -->
    <div class="container">
        <!-- Header / Website Name -->
        <header>
            <h1 class="logo">Bot<span>Sphere</span></h1>
            <p class="tagline">Your Ultimate Automation & Bot Hub</p>
        </header>

        <!-- Main Card Interface -->
        <main class="card">
            <h2>Welcome to the Dashboard</h2>
            <p>Your Telegram bot and web services are up and running smoothly. Manage your configurations and status below.</p>
            
            <div class="status-box">
                <span class="status-dot"></span>
                <span>System Status: <strong style="color: #2ecc71;">Online (24/7)</strong></span>
            </div>

            <div class="btn-group">
                <a href="https://t.me/nahif2008_bot" target="_blank" class="btn primary-btn">Open Telegram Bot</a>
                <a href="#settings" class="btn secondary-btn">Configuration</a>
            </div>
        </main>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 BotSphere. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
